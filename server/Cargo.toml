[package]
name = "kg2lx-server"
version = "0.2.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
dotenvy = "0.15.7"
reqwest = { version = "0.13.2", features = ["json", "query"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
subtle = "2.6.1"
tempfile = "3.27.0"
tokio = { version = "1.52.0", features = ["fs", "macros", "rt-multi-thread", "signal", "sync"] }
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v4"] }
